<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مواعيدي</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#173DAD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F5;--surf:#fff;--ink:#12262E;--mute:#5E727A;--line:#D9E2E6;--brand:#0E5A6B;--onbrand:#fff;--warn:#B3261E;--warnbg:#FCE9E7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A1F;--surf:#16282F;--ink:#E8F0F2;--mute:#92A8B0;--line:#27404A;--brand:#5CC0D4;--onbrand:#08242B;--warn:#FFB4AB;--warnbg:#3D1F1C}}
:root[data-theme="dark"]{--bg:#0D1A1F;--surf:#16282F;--ink:#E8F0F2;--mute:#92A8B0;--line:#27404A;--brand:#5CC0D4;--onbrand:#08242B;--warn:#FFB4AB;--warnbg:#3D1F1C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:16px;line-height:1.5}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:16px 16px 110px}
h1{font-size:26px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
.next{background:var(--brand);color:var(--onbrand);border-radius:20px;padding:16px 18px;margin-bottom:16px}
.next b{font-size:20px;display:block}
.next small{opacity:.85;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.ev{background:var(--surf);border-radius:16px;margin-bottom:10px;display:flex;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.ev .bar{width:7px;flex:none}
.ev .t{padding:12px 6px 12px 14px;min-width:78px;font-weight:700;font-size:15px;color:var(--mute)}
.ev .t span{display:block;font-weight:400;font-size:12px}
.ev .b{padding:12px 6px 12px 14px;flex:1}
.ev .b strong{display:block;font-size:17px}
.ev .b em{font-style:normal;color:var(--mute);font-size:14px}
.ev.off{opacity:.5}.ev.off strong{text-decoration:line-through}
.tag{display:inline-block;font-size:12px;border-radius:8px;padding:1px 8px;margin-inline-start:6px;background:var(--warnbg);color:var(--warn);font-weight:700}
.empty{text-align:center;color:var(--mute);padding:36px 12px;border:1.5px dashed var(--line);border-radius:16px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.days button{border:0;background:var(--surf);color:var(--ink);border-radius:12px;padding:8px 0;font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line)}
.days button[aria-pressed="true"]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.days button i{display:block;font-style:normal;font-size:11px;opacity:.7}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav div{display:flex;width:100%;max-width:520px}
.nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:6px;cursor:pointer;border-radius:12px}
.nav button[aria-current="true"]{color:var(--brand);font-weight:800}
.nav button span{display:block;font-size:20px}
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,calc(50% - 244px));width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:var(--onbrand);font-size:30px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--surf);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.panel h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:14px;background:var(--brand);color:var(--onbrand);font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.btn.alt{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);margin-top:8px}
.btn.del{background:var(--warnbg);color:var(--warn);margin-top:8px}
.kid{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.sw{display:flex;gap:8px;margin-top:6px}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.sec{margin:22px 0 8px;font-size:17px;font-weight:800}
.tg{display:flex;justify-content:space-between;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px}
.tg input{width:22px;height:22px;accent-color:var(--brand)}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.top{display:flex;justify-content:space-between;align-items:flex-start}.gear{border:1px solid var(--line);background:var(--surf);border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;flex:none}.det{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.det span{color:var(--mute);width:78px;flex:none;font-size:14px}.det b{font-weight:500}textarea{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}.hd{display:flex;gap:14px;align-items:center;margin:10px 0 6px}.kid{cursor:pointer}button:focus-visible{outline-offset:2px}.ask{background:var(--surf);border:2px solid var(--brand);border-radius:16px;padding:12px 14px;margin-bottom:12px}.bd{background:#C0392B;color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-inline-start:4px}.brand{display:flex;gap:6px;align-items:center;font-weight:800;color:var(--brand);font-size:15px;margin-bottom:6px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<button class="fab" id="fab" aria-label="إضافة موعد">+</button>
<nav class="nav"><div id="nav"></div></nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script>
var COLORS=['#E4572E','#2E86AB','#7A5CC9','#2F9E6B','#D98E04','#C2418B'];
var DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var DAYS_S=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
var ORDER=[6,0,1,2,3,4,5];
var PLACES=['المنزل','السنتر','أونلاين','المدرسة'];
var TONES={bell:['جرس',[[880,0,.5],[1320,.15,.6]],'sine'],calm:['هادئة',[[523,0,.3],[659,.25,.3],[784,.5,.6]],'sine'],piano:['بيانو',[[392,0,.25],[494,.2,.25],[587,.4,.25],[784,.6,.6]],'triangle'],bird:['عصفور',[[1800,0,.08],[2200,.1,.08],[1800,.2,.08],[2400,.3,.14]],'sine'],alarm:['منبه',[[740,0,.15],[740,.25,.15],[740,.5,.15]],'square'],custom:['من هاتفك',[],'sine']};
var AC,S,dirty=0,dbDoc=null,tm;
var CU={};
function play(k,wid){if(k==='custom'&&CU[wid]){try{var au=new Audio(CU[wid]);au.play();setTimeout(function(){au.pause()},20000)}catch(e){}return}if(k==='custom')k='bell';try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();var T=TONES[k]||TONES.bell,t0=AC.currentTime;T[1].forEach(function(n){var o=AC.createOscillator(),g=AC.createGain();o.type=T[2];o.frequency.value=n[0];g.gain.setValueAtTime(0,t0+n[1]);g.gain.linearRampToValueAtTime(.18,t0+n[1]+.02);g.gain.exponentialRampToValueAtTime(.001,t0+n[1]+n[2]);o.connect(g);g.connect(AC.destination);o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+.05)})}catch(e){}}
function def(){var d=new Date().getDay();return{kids:[{id:'k1',name:'ياسين',color:COLORS[0],tone:'bell'},{id:'k2',name:'ليلى',color:COLORS[1],tone:'piano'}],
 ev:[{id:'e1',who:'k1',title:'رياضيات',teacher:'أ. محمود',place:'السنتر',day:d,time:'16:00',notes:'إحضار كتاب التمارين',off:[]},{id:'e2',who:'k2',title:'لغة إنجليزية',teacher:'مس سارة',place:'أونلاين',day:d,time:'16:30',notes:'',off:[]},{id:'e3',who:'k1',title:'علوم',teacher:'أ. هالة',place:'المنزل',day:(d+1)%7,time:'17:00',notes:'',off:[]},{id:'e4',who:'me',title:'موعد طبيب',teacher:'',place:'العيادة',day:(d+2)%7,time:'11:00',notes:'',off:[]}],
 set:{day:true,hour:true,half:true,morning:true},lead:30,alerts:[],meTone:'bell',view:'today',day:d,filter:'all',kid:null}}
function norm(x){var D=def();x.set=x.set||D.set;x.lead=x.lead||30;x.alerts=x.alerts||[];x.meTone=x.meTone||'bell';x.kids.forEach(function(k){k.tone=k.tone||'bell'});x.ev.forEach(function(e){e.notes=e.notes||'';e.off=e.off||[]});return x}
try{S=norm(JSON.parse(localStorage.getItem('mw2')||localStorage.getItem('mw1')))}catch(e){S=null}
if(!S)S=def();
function save(){dirty=1;try{localStorage.setItem('mw2',JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(function(){if(dbDoc)dbDoc.set({s:JSON.stringify(S)}).catch(function(){})},500)}
try{if(window.claude&&claude.use){claude.use('user').then(function(u){return u?u.id():null}).then(function(id){return claude.use('db').then(function(db){if(!db||!id)return;dbDoc=db.doc('data/users/'+id+'/state');return dbDoc.get().then(function(sn){if(sn.exists&&!dirty){S=norm(JSON.parse(sn.data().s));render()}else if(!sn.exists)dbDoc.set({s:JSON.stringify(S)})})})}).catch(function(){})}}catch(e){}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function who(id){if(id==='me')return{id:'me',name:'أنا',color:'#0E5A6B',tone:S.meTone};return S.kids.filter(function(k){return k.id===id})[0]||{name:'؟',color:'#888',tone:'bell'}}
function dstr(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
function dateOfDay(day){var n=new Date(),diff=(day-n.getDay()+7)%7;n.setDate(n.getDate()+diff);return dstr(n)}
function mins(t){var p=t.split(':');return +p[0]*60+ +p[1]}
function fmt(t){var p=t.split(':'),h=+p[0]%12||12;return h+':'+p[1]}
function ampm(t){return +t.split(':')[0]>=12?'مساءً':'صباحًا'}
function isOff(e){return e.off.indexOf(dateOfDay(e.day))>=0}
function clash(e){return !isOff(e)&&S.ev.some(function(o){if(o.id===e.id||o.day!==e.day||isOff(o)||Math.abs(mins(o.time)-mins(e.time))>=60)return false;if(o.who===e.who)return true;if(o.who==='me'||e.who==='me')return false;return o.place===e.place&&(e.place==='المنزل'||e.place==='أونلاين')})}
function evHTML(e){var w=who(e.who),off=isOff(e);
 return '<div class="ev'+(off?' off':'')+'" data-id="'+e.id+'" tabindex="0" role="button"><div class="bar" style="background:'+w.color+'"></div><div class="t">'+fmt(e.time)+'<span>'+ampm(e.time)+'</span></div><div class="b"><strong>'+esc(e.title)+(clash(e)?'<span class="tag">تعارض</span>':'')+(e.moved?'<span class="tag" style="background:var(--bg);color:var(--brand)">مؤجل</span>':'')+(e.by==='child'&&S.view!=='child'?'<span class="tag" style="background:var(--bg);color:var(--brand)">أضافه الطفل</span>':'')+(off?'<span class="tag" style="background:var(--bg);color:var(--mute)">ملغى اليوم</span>':'')+'</strong><em>'+esc(w.name)+(e.teacher?' · '+esc(e.teacher):'')+' · '+esc(e.place)+'</em></div></div>'}
function list(day,f){var ds=dateOfDay(day),a=[];S.ev.forEach(function(e){if(f!=='all'&&e.who!==f)return;if(e.post&&e.post.date===ds)a.push(Object.assign({},e,{time:e.post.time,off:[],moved:1,day:day}));else if(e.day===day&&!(e.post&&e.post.from===ds))a.push(e)});a.sort(function(x,y){return mins(x.time)-mins(y.time)});return a}
var LOGO='<svg width="28" height="28" viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="230" fill="#0E5A6B"/><g transform="translate(512 512) scale(0.92) translate(-512 -512)"><g transform="translate(0,-30)"><circle cx="215" cy="330" r="72" fill="#7CD4F2"/><rect x="125" y="420" width="180" height="380" rx="76" fill="#7CD4F2"/><circle cx="809" cy="330" r="72" fill="#FF8A5B"/><path d="M719 450Q719 420 749 420H869Q899 420 899 450L964 800H690Z" fill="#FF8A5B"/><circle cx="512" cy="400" r="156" fill="#fff"/><circle cx="512" cy="400" r="156" fill="none" stroke="#FFD166" stroke-width="18"/><path d="M512 400V305M512 400L582 436" stroke="#0E5A6B" stroke-width="24" stroke-linecap="round"/><circle cx="512" cy="400" r="16" fill="#0E5A6B"/><circle cx="512" cy="272" r="9" fill="#0E5A6B"/><circle cx="512" cy="528" r="9" fill="#0E5A6B"/><circle cx="384" cy="400" r="9" fill="#0E5A6B"/><circle cx="640" cy="400" r="9" fill="#0E5A6B"/><circle cx="424" cy="648" r="54" fill="#FFD166"/><rect x="360" y="712" width="128" height="140" rx="54" fill="#FFD166"/><circle cx="600" cy="648" r="54" fill="#fff"/><rect x="536" y="712" width="128" height="140" rx="54" fill="#fff"/></g></g></svg>';
function addAlert(o){o.id='a'+Date.now()+Math.random().toString(36).slice(2,5);o.at=Date.now();S.alerts.unshift(o);if(S.alerts.length>50)S.alerts.length=50}
function unread(){return S.alerts.filter(function(a){return !a.done}).length}
function askCards(){var n=new Date(),nm=n.getHours()*60+n.getMinutes(),td=dstr(n),h='';list(n.getDay(),S.kid).forEach(function(e){var d=nm-mins(e.time);if(d>=45&&d<300&&e.fin!==td&&!isOff(e))h+='<div class="ask"><b>هل انتهى درس '+esc(e.title)+'؟</b><div class="chips" style="margin:8px 0 0"><button class="chip" data-fin="'+e.id+'">انتهى</button><button class="chip" data-post="'+e.id+'">تأجيل</button><button class="chip" data-skip="'+e.id+'">لم يتم</button></div></div>'});return h}
function alertsHTML(){var h='',tdy=dstr(new Date()),tmr=dstr(new Date(Date.now()+864e5));if(!S.alerts.length)return '<div class="empty">لا توجد تنبيهات بعد.<br>تظهر هنا إجراءات الأبناء بعد دروسهم.</div>';
 S.alerts.forEach(function(a){var w=who(a.kid),tt=new Date(a.at).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'}),msg,b='',st='';
  if(a.type==='done')msg=esc(w.name)+' أنهى درس '+esc(a.title);
  if(a.type==='skip')msg='لم يتم درس '+esc(a.title)+' اليوم ('+esc(w.name)+')';
  if(a.type==='postpone')msg=esc(w.name)+' يطلب تأجيل '+esc(a.title)+' إلى '+(a.toDate===tdy?'اليوم':a.toDate===tmr?'غدًا':a.toDate)+' '+fmt(a.toTime)+' '+ampm(a.toTime);
  if(a.type==='added')msg=esc(w.name)+' أضاف موعدًا: '+esc(a.title)+' ('+esc(a.days)+')';
  if(!a.done){if(a.type==='postpone')b='<button class="chip" data-aa="ok" data-aid="'+a.id+'">موافق</button><button class="chip" data-aa="no" data-aid="'+a.id+'">رفض</button>';
   else if(a.type==='added')b='<button class="chip" data-aa="edit" data-aid="'+a.id+'">تعديل</button><button class="chip" data-aa="del" data-aid="'+a.id+'">حذف</button><button class="chip" data-aa="seen" data-aid="'+a.id+'">تم</button>';
   else b='<button class="chip" data-aa="seen" data-aid="'+a.id+'">تم</button>'}
  else st=a.status==='ok'?' · تمت الموافقة':a.status==='no'?' · رُفض':a.status==='del'?' · حُذف':'';
  h+='<div class="e" style="opacity:'+(a.done?.65:1)+'"><i style="background:'+w.color+'"></i><div style="flex:1"><b>'+msg+'</b><span>'+tt+st+'</span>'+(b?'<div class="chips" style="padding:10px 0 0;margin:0">'+b+'</div>':'')+'</div></div>'});return h}
function chips(){var h='<div class="chips"><button class="chip" data-f="all" aria-pressed="'+(S.filter==='all')+'">الكل</button><button class="chip" data-f="me" aria-pressed="'+(S.filter==='me')+'"><i class="dot" style="background:#0E5A6B"></i>أنا</button>';
 S.kids.forEach(function(k){h+='<button class="chip" data-f="'+k.id+'" aria-pressed="'+(S.filter===k.id)+'"><i class="dot" style="background:'+k.color+'"></i>'+esc(k.name)+'</button>'});return h+'</div>'}
function nextBanner(fk){var now=new Date(),nm=now.getHours()*60+now.getMinutes();
 var a=list(now.getDay(),fk||'all').filter(function(e){return mins(e.time)>nm&&!isOff(e)});
 if(!a.length)return '<div class="next"><b>لا مواعيد قادمة اليوم</b><small>استمتعوا بباقي اليوم</small></div>';
 var e=a[0],d=mins(e.time)-nm,w=who(e.who),far=e.place!=='أونلاين'&&e.place!=='المنزل'?' · اخرج قبلها بـ '+S.lead+' دقيقة':'';
 var txt=d>=60?Math.floor(d/60)+' ساعة'+(d%60?' و'+d%60+' دقيقة':''):d+' دقيقة';
 return '<div class="next"><small>الموعد القادم</small><b>'+esc(e.title)+' · '+esc(w.name)+'</b><small>بعد '+txt+far+'</small></div>'}
function topBar(t,sub){return '<div class="top"><div><div class="brand">'+LOGO+'مواعيدي</div><h1>'+t+'</h1><p class="sub">'+sub+'</p></div><button class="gear" data-v="settings" aria-label="الإعدادات">⚙️</button></div>'}
function toneRow(id,cur){var h='<div class="chips">';Object.keys(TONES).forEach(function(k){if(k==='custom')return;h+='<button class="chip" data-tone="'+k+'" data-tw="'+id+'" aria-pressed="'+(cur===k)+'">🔔 '+TONES[k][0]+'</button>'});return h+'<label class="chip" aria-pressed="'+(cur==='custom')+'">📱 '+(cur==='custom'&&S.cn&&S.cn[id]?esc(S.cn[id]):'من هاتفك')+'<input type="file" accept="audio/*" data-file="'+id+'" hidden></label></div>'}
function render(){var h='',v=S.view,t=new Date().getDay();
 if(v==='today'){h+=topBar('اليوم',DAYS[t]+' '+new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'long'}))+nextBanner()+chips();
